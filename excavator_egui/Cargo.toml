[package]
name = "excavator_egui"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUI
eframe = { version = "0.34.1", features = ["persistence"] }
egui = "0.34.1"
egui_extras = "0.34.1"
egui_ltreeview = "0.7.0"
excavator_backend = { version = "0.1.0", path = "../excavator_backend" }
rfd = "0.17.2"

# async
async-executor = { version = "1.14.0", features = ["static"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }

# miscellaneous
anyhow = "1.0.100"
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = "1.0.228"
