[workspace]
resolver = "3"
members = ["excavator_backend", "excavator_backend_macros", "excavator_egui"]
default-members = ["excavator_egui"]

[profile.dev.package."*"]
# So this one time the program got a little laggy while scrolling through a long list.
# I set opt-level = 3 here to speed that up, and then kinda stuck with that setting for a while.
# The downside of that was that it utterly ballooned the time it took to recompile dependencies when they changed.
# I've switched to a more moderate setting to keep compile times convenient.
# With opt-level = 1 like this I got it rebuilt from zero in 15 minutes.
opt-level = 1

[workspace.dependencies]
# For convenience, we've gathered every dependency in the workspace (not counting intra-workspace ones) in this single place, and lightly categorized them.

# Small and handy things
anyhow = "1.0.102"
bstr = { version = "1.12.1", default-features = false, features = ["alloc", "serde"] }
lexical-sort = "0.3.1"
zerocopy = { version = "0.8.39", features = ["std"] }
zerocopy-derive = "0.8.39"

# Big and handy things
hecs = "0.11.1"
hecs-hierarchy = { git = "https://github.com/AmossGuy/hecs-hierarchy", rev = "f457667" } # Upstream hasn't been updated to hecs 0.11.0, so I cobbled together a patch myself.
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = "1.0.228"

# GUI
eframe = { version = "0.34.1", features = ["persistence"] }
egui = "0.34.1"
egui_extras = "0.34.1"
egui_ltreeview = { git = "https://github.com/LennysLounge/egui_ltreeview.git", rev = "05f7b4a27033dbfc79578f243bcc9d126b41ff1d" } # Was using a rev because a bugfix hadn't made it to release yet, but it's released now so I'll update it shortly
rfd = "0.17.2"

# For procedural macros
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.2"
