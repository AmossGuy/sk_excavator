[workspace]
resolver = "3"
members = ["excavator_backend", "excavator_egui"]
default-members = ["excavator_egui"]

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
anyhow = "1.0.102"
bevy_ecs = { version = "0.19.0", features = ["bevy_reflect", "reflect_auto_register"] }
bevy_reflect = "0.19.0"
bstr = { version = "1.12.1", default-features = false, features = ["alloc"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = "1.0.228"
